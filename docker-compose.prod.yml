services:
  api:
    image: ghcr.io/adamba4a/fe-el-seka-api:latest
    restart: always
    env_file: .env.prod
    networks:
      - fe-el-seka-prod
    deploy:
      resources:
        reservations:
          memory: 256M

  ai:
    image: ghcr.io/adamba4a/fe-el-seka-ai:latest
    restart: always
    env_file: .env.prod
    networks:
      - fe-el-seka-prod
    deploy:
      resources:
        reservations:
          memory: 512M

  main:
    image: ghcr.io/adamba4a/fe-el-seka-main:latest
    restart: always
    env_file: .env.prod
    environment:
      # The Next.js API proxy uses the Docker network, so it remains available
      # when the CDN routes the public domain directly to the frontend.
      BACKEND_INTERNAL_URL: http://api:8000
    networks:
      - fe-el-seka-prod
    deploy:
      resources:
        reservations:
          memory: 128M

  osrm:
    image: ghcr.io/adamba4a/fe-el-seka-osrm:latest
    restart: always
    networks:
      - fe-el-seka-prod
    deploy:
      resources:
        reservations:
          memory: 512M

  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - fe-el-seka-prod
    depends_on:
      - api
      - ai
      - main
    deploy:
      resources:
        reservations:
          memory: 64M

networks:
  fe-el-seka-prod:
    driver: bridge
