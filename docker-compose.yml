# Prerequisites: run `supabase start` before `docker compose up`
# Supabase CLI manages the local database — it is not part of this compose stack.

services:
  api:
    build:
      context: services/api
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    env_file: services/api/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@supabase_db_fe-el-seka:5432/postgres
      SUPABASE_URL: http://supabase_kong_fe-el-seka:8000
      AI_SERVICE_URL: http://ai:8000
      # Local dev only: notification_service's smtp_host default (127.0.0.1) assumes
      # a host-machine Mailpit, but this container reaches Supabase's Inbucket over
      # the docker network instead — its internal SMTP port is 1025, not the
      # host-mapped 54325.
      SMTP_HOST: supabase_inbucket_fe-el-seka
      SMTP_PORT: "1025"
      # services/api/.env carries a real (prod) Resend key, which sends from
      # noreply@triplyy.net and fails locally since that domain isn't set up
      # to receive test mail. Override to empty here only, so
      # notification_service._use_mailpit() routes local sends to Inbucket instead
      # — .env itself (and prod) is untouched.
      RESEND_API_KEY: ""
    volumes:
      - ./services/api/app:/app/app
    networks:
      - fe-el-seka-dev
      - supabase_network_fe-el-seka

  ai:
    build:
      context: services/ai
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    env_file: services/ai/.env
    environment:
      SUPABASE_URL: http://supabase_kong_fe-el-seka:8000
    volumes:
      - ./services/ai/app:/app/app
      - ./services/ai/pipelines:/app/pipelines
    networks:
      - fe-el-seka-dev
      - supabase_network_fe-el-seka

  main:
    build:
      context: .
      dockerfile: apps/main/Dockerfile
      target: deps
    command: ["pnpm", "--filter", "@fe-el-seka/main", "dev"]
    env_file: apps/main/.env
    environment:
      SUPABASE_INTERNAL_URL: http://supabase_kong_fe-el-seka:8000
      WATCHPACK_POLLING: "true"
    volumes:
      - ./apps/main/src:/app/apps/main/src
      - ./apps/main/public:/app/apps/main/public
      - ./apps/main/messages:/app/apps/main/messages
      - ./apps/main/tailwind.config.ts:/app/apps/main/tailwind.config.ts
      - ./packages:/app/packages
    networks:
      - fe-el-seka-dev
      - supabase_network_fe-el-seka

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    command: osrm-routed --algorithm ch /data/egypt-latest.osrm
    volumes:
      - ./osrm-data:/data:ro
    ports:
      - "5000:5000"
    networks:
      - fe-el-seka-dev
    profiles:
      - osrm

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - fe-el-seka-dev
    depends_on:
      - api
      - ai
      - main

networks:
  fe-el-seka-dev:
    driver: bridge
  supabase_network_fe-el-seka:
    external: true
